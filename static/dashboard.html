<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Universal Lead Collector</h1>
            <p>Targeting Bahawalpur Businesses without Websites</p>
        </div>
    </header>

    <main>
        <section class="analytics-section">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>New Leads</h3>
                <p id="stat-new">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="stat-contacted">0</p>
            </div>
        </section>

        <section class="table-section">
            <div class="table-header">
                <h2>Active Leads</h2>
                <button id="refresh-btn" class="btn">Refresh Data</button>
            </div>
            <div class="table-container">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <!-- Leads will be populated here by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Business Solutions Lead Collector</p>
    </footer>
</body>
</html>
