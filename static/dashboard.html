<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Lead Collector</h1>
            <div class="stats" id="stats">
                <div class="stat-box">
                    <span class="stat-label">Total Leads</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">New Leads</span>
                    <span class="stat-value" id="stat-new">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Contacted</span>
                    <span class="stat-value" id="stat-contacted">0</span>
                </div>
            </div>
        </header>

        <main>
            <table class="leads-table">
                <thead>
                    <tr>
                        <th>Business Name</th>
                        <th>Type</th>
                        <th>City</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <!-- Leads will be dynamically inserted here -->
                </tbody>
            </table>
            <div id="loading" class="loading" style="display: none;">Loading leads...</div>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
