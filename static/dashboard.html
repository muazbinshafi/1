<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Collector Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Lead Collector</h1>
            <p>Targeting Bahawalpur Businesses without Websites</p>
        </header>

        <section class="analytics">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="total-leads">0</p>
            </div>
            <div class="stat-card">
                <h3>New Leads</h3>
                <p id="new-leads">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="contacted-leads">0</p>
            </div>
        </section>

        <section class="leads-table-container">
            <table class="leads-table">
                <thead>
                    <tr>
                        <th>Business Name</th>
                        <th>Type</th>
                        <th>City</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <!-- Leads will be populated here -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
