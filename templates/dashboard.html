<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Universal Lead Collector</h1>
                <p class="subtitle">Automated Lead Generation Dashboard</p>
                <div class="location-badge">📍 Bahawalpur, Punjab, Pakistan</div>
            </div>
        </header>

        <section class="analytics">
            <div class="card total">
                <h3>Total Leads</h3>
                <p id="total-leads">0</p>
            </div>
            <div class="card contacted">
                <h3>Contacted</h3>
                <p id="contacted-leads">0</p>
            </div>
            <div class="card new">
                <h3>New Leads</h3>
                <p id="new-leads">0</p>
            </div>
        </section>

        <section class="leads-section">
            <div class="table-header">
                <h2>Active Leads</h2>
                <button id="refresh-btn" class="refresh-btn">Refresh Data</button>
            </div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <!-- Leads will be populated here -->
                    </tbody>
                </table>
            </div>
            <div id="loading" class="loading">Loading leads...</div>
            <div id="no-data" class="no-data" style="display: none;">No new leads found.</div>
        </section>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
