<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/script.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Universal Lead Collector</h1>
            <p>Targeting businesses in Bahawalpur without an online presence.</p>
        </header>

        <section class="stats-section">
            <div class="stat-card">
                <h3>Total Leads Found</h3>
                <p id="total-leads">0</p>
            </div>
            <div class="stat-card">
                <h3>New Leads (Active)</h3>
                <p id="new-leads">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted Leads</h3>
                <p id="contacted-leads">0</p>
            </div>
        </section>

        <section class="table-section">
            <h2>Active Leads</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table-body">
                        <!-- Leads will be dynamically populated here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
