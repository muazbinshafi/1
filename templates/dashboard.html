<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector - Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <h1><i class="fas fa-bullseye"></i> Universal Lead Collector</h1>
                <p>Automated Lead Generation & Outreach System</p>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span> System Active
            </div>
        </header>

        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-database"></i></div>
                <div class="stat-info">
                    <h3>Total Collected</h3>
                    <p id="total-leads">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info">
                    <h3>Contacted</h3>
                    <p id="contacted-leads">0</p>
                </div>
            </div>
            <div class="stat-card highlight">
                <div class="stat-icon"><i class="fas fa-bolt"></i></div>
                <div class="stat-info">
                    <h3>New Leads</h3>
                    <p id="new-leads">0</p>
                </div>
            </div>
        </div>

        <!-- Leads Table -->
        <div class="leads-section">
            <div class="section-header">
                <h2><i class="fas fa-list"></i> Active Leads (Bahawalpur)</h2>
                <div class="actions">
                    <button id="refresh-btn" class="btn-secondary"><i class="fas fa-sync-alt"></i> Refresh</button>
                    <!-- Manual collect button for demo/admin -->
                    <button id="collect-btn" class="btn-primary"><i class="fas fa-search-location"></i> Collect More</button>
                </div>
            </div>
            <div class="table-container">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Rows will be populated by JS -->
                        <tr class="loading-row">
                            <td colspan="5">Loading leads...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/script.js"></script>
</body>
</html>
