<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="/static/js/script.js" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Universal Lead Collector</h1>
            <p>Targeting Bahawalpur, Punjab, Pakistan</p>
        </header>

        <section class="analytics-section">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="total-leads">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="contacted-leads">0</p>
            </div>
            <div class="stat-card highlight">
                <h3>New Leads</h3>
                <p id="new-leads">0</p>
            </div>
        </section>

        <section class="leads-section">
            <h2>Recent Uncontacted Leads</h2>
            <div class="table-responsive">
                <table class="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table-body">
                        <!-- Leads injected here via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
