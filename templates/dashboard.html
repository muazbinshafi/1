<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Lead Collector</h1>
            <p class="subtitle">Bahawalpur Business Outreach Dashboard</p>
        </header>

        <!-- Analytics Cards -->
        <div class="stats-container">
            <div class="card">
                <h3>Total Leads</h3>
                <p id="total-leads">0</p>
            </div>
            <div class="card">
                <h3>Contacted</h3>
                <p id="contacted-leads">0</p>
            </div>
            <div class="card highlight">
                <h3>New Leads</h3>
                <p id="new-leads">0</p>
            </div>
        </div>

        <!-- Leads Table -->
        <div class="table-container">
            <table id="leads-table">
                <thead>
                    <tr>
                        <th>Business Name</th>
                        <th>Type</th>
                        <th>City</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Leads will be inserted here dynamically -->
                </tbody>
            </table>
            <div id="loading" class="loading">Loading leads...</div>
        </div>
    </div>

    <!-- Script -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
