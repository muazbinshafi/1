<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Defer script to ensure non-blocking loading while early parsing -->
    <script src="/static/js/script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Business Solutions Lead Dashboard</h1>
            <p>Target Area: Bahawalpur, Punjab, Pakistan</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="total-leads" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="contacted-leads" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <h3>New Leads</h3>
                <p id="new-leads" class="stat-value">0</p>
            </div>
        </div>

        <div class="table-container">
            <table id="leads-table">
                <thead>
                    <tr>
                        <th>Business Name</th>
                        <th>Type</th>
                        <th>City</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <!-- Leads injected here -->
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
