<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Lead Collector</h1>
            <div class="stats-container">
                <div class="stat-card">
                    <h3>Total Leads</h3>
                    <p id="total-leads">0</p>
                </div>
                <div class="stat-card">
                    <h3>New Leads</h3>
                    <p id="new-leads">0</p>
                </div>
                <div class="stat-card">
                    <h3>Contacted</h3>
                    <p id="contacted-leads">0</p>
                </div>
            </div>
        </header>

        <main>
            <div class="table-container">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <!-- Leads will be populated here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
