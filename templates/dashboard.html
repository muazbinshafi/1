<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Universal Lead Collector</h1>
            <p>Targeting Bahawalpur Businesses</p>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="total-leads" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <h3>New Leads</h3>
                <p id="new-leads" class="stat-value">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="contacted-leads" class="stat-value">0</p>
            </div>
        </div>

        <div class="table-container">
            <h2>Active Leads</h2>
            <table id="leads-table">
                <thead>
                    <tr>
                        <th>Business Name</th>
                        <th>Type</th>
                        <th>City</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <!-- Leads will be injected here via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
