<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <!-- Use Google Fonts (blocked in headless sometimes but fine for real usage) -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Non-blocking script loading -->
    <script src="/static/js/script.js" defer></script>
</head>
<body>

    <header>
        <h1>Universal Lead Collector Dashboard</h1>
    </header>

    <div class="stats-container">
        <div class="stat-box">
            <h3>Total Leads</h3>
            <p id="stat-total">0</p>
        </div>
        <div class="stat-box">
            <h3>Contacted</h3>
            <p id="stat-contacted">0</p>
        </div>
        <div class="stat-box">
            <h3>New / Pending</h3>
            <p id="stat-new">0</p>
        </div>
    </div>

    <div class="table-container">
        <table id="leads-table">
            <thead>
                <tr>
                    <th>Business Name</th>
                    <th>Type</th>
                    <th>City</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="leads-body">
                <!-- Data populated dynamically -->
            </tbody>
        </table>
    </div>

</body>
</html>
