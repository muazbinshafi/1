<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Lead Collector Dashboard</h1>
            <p>Targeting businesses in Bahawalpur without websites</p>
        </header>

        <section class="analytics">
            <div class="card card-total">
                <h3>Total Leads</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="card card-contacted">
                <h3>Contacted</h3>
                <p id="stat-contacted">0</p>
            </div>
            <div class="card card-new">
                <h3>New Uncontacted</h3>
                <p id="stat-new">0</p>
            </div>
        </section>

        <section class="leads-table-container">
            <h2>Active Leads</h2>
            <table id="leads-table">
                <thead>
                    <tr>
                        <th>Business Name</th>
                        <th>Type</th>
                        <th>City</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <!-- Data populated via JS -->
                </tbody>
            </table>
        </section>
    </div>

    <!-- Script deferred to end of body for faster render, or we could put it in head with defer -->
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
