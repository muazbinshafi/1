<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-bullhorn"></i> Universal Lead Collector</h1>
            <div id="stats">
                <span id="lead-count">Loading...</span> Leads Available
            </div>
        </header>

        <div id="analytics" class="stats-container">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="stat-contacted">0</p>
            </div>
            <div class="stat-card">
                <h3>Available</h3>
                <p id="stat-new">0</p>
            </div>
        </div>

        <main>
            <div class="table-responsive">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Leads will be injected here -->
                    </tbody>
                </table>
            </div>
            <div id="loading" class="hidden">
                <i class="fas fa-spinner fa-spin"></i> Refreshing leads...
            </div>
            <div id="empty-state" class="hidden">
                <p>No new leads available. Auto-replenishing...</p>
            </div>
        </main>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
