<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <!-- Use basic CSS instead of external stylesheets for reliability during testing if needed -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Universal Lead Collector</h1>
            <p>Targeting businesses in Bahawalpur without a digital footprint.</p>
        </header>

        <section class="analytics-cards">
            <div class="card total">
                <h3>Total Leads</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="card new">
                <h3>New Opportunities</h3>
                <p id="stat-new">0</p>
            </div>
            <div class="card contacted">
                <h3>Contacted</h3>
                <p id="stat-contacted">0</p>
            </div>
        </section>

        <section class="table-container">
            <table id="leads-table">
                <thead>
                    <tr>
                        <th>Business Name</th>
                        <th>Type</th>
                        <th>City</th>
                        <th>Phone</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="leads-body">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </section>
    </div>
</body>
</html>
