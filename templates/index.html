<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Defer JS -->
    <script src="/static/js/script.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>Universal Lead Collector</h1>
        <p>Target: Businesses without websites in Bahawalpur, Pakistan</p>
    </header>

    <div class="dashboard">
        <!-- Analytics Section -->
        <section class="analytics">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="total-leads">0</p>
            </div>
            <div class="stat-card">
                <h3>New Leads</h3>
                <p id="new-leads">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="contacted-leads">0</p>
            </div>
        </section>

        <!-- Leads Table Section -->
        <section class="leads-container">
            <h2>Active Leads</h2>
            <div class="table-responsive">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <!-- Dynamic rows will be inserted here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
