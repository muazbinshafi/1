<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector Dashboard</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Defer JS for non-blocking -->
    <script src="/static/js/script.js" defer></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1>Lead Generation Dashboard</h1>
            <div class="stats-container">
                <div class="stat-card">
                    <span class="stat-title">Total Found</span>
                    <span id="stat-total" class="stat-value">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">New Leads</span>
                    <span id="stat-new" class="stat-value">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Contacted</span>
                    <span id="stat-contacted" class="stat-value">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="leads-section">
            <div class="section-header">
                <h2>Active Leads (No Website)</h2>
                <div class="status-indicator">
                    <span class="pulse"></span> Live Sync Active
                </div>
            </div>

            <div class="table-container">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-tbody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>

            <div id="loading-state" class="loading-state">
                <div class="spinner"></div>
                <p>Syncing latest local businesses...</p>
            </div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <p>No new leads found. The background collector is scanning for more businesses without websites in Bahawalpur...</p>
            </div>
        </section>
    </main>
</body>
</html>
