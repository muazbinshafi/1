<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Lead Collector</h1>
            <p>Targeting businesses in Bahawalpur without websites</p>
        </header>

        <section class="analytics">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="stat-contacted">0</p>
            </div>
            <div class="stat-card">
                <h3>New (Active)</h3>
                <p id="stat-new">0</p>
            </div>
        </section>

        <section class="dashboard">
            <h2>Active Leads</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-table-body">
                        <!-- Leads will be dynamically injected here -->
                        <tr><td colspan="5" style="text-align: center;">Loading leads...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
