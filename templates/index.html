<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Universal Lead Collector</h1>
            <p>Targeting businesses without websites for digital transformation.</p>
        </div>
    </header>

    <main class="dashboard">
        <section class="analytics-section">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>New Leads</h3>
                <p id="stat-new">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="stat-contacted">0</p>
            </div>
        </section>

        <section class="table-section">
            <h2>Active Leads</h2>
            <div class="table-responsive">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-tbody">
                        <!-- Leads will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
            <div id="no-leads-message" class="hidden">
                <p>No new leads found. The system is actively searching...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Lead Collection System &copy; Business Solutions</p>
    </footer>
</body>
</html>
