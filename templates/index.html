<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <h1>Universal Lead Collector</h1>
            </div>
            <div class="user-profile">
                <span class="avatar">MB</span>
                <span class="user-name">MuazBinShafi</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="analytics-section">
            <div class="stat-card">
                <div class="stat-icon new">🌟</div>
                <div class="stat-info">
                    <h3>New Leads</h3>
                    <p id="stat-new" class="stat-value">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon contacted">✅</div>
                <div class="stat-info">
                    <h3>Contacted</h3>
                    <p id="stat-contacted" class="stat-value">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon total">📈</div>
                <div class="stat-info">
                    <h3>Total Collected</h3>
                    <p id="stat-total" class="stat-value">0</p>
                </div>
            </div>
        </section>

        <section class="leads-section">
            <div class="section-header">
                <h2>Active Leads Without Websites</h2>
                <div class="target-location">📍 Bahawalpur, PK</div>
            </div>

            <div class="table-container">
                <table class="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <tr id="loading-row">
                            <td colspan="5" class="text-center loading-text">Loading leads...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
