<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <h1>Universal Lead Collector <span>Dashboard</span></h1>
            </div>
            <div class="controls">
                <button id="collectBtn" class="btn primary">
                    <span class="icon">🔍</span> Collect Leads
                </button>
                <div id="status" class="status-msg"></div>
            </div>
        </header>

        <section class="analytics-section">
            <div class="card">
                <h3>Total Leads</h3>
                <p id="totalLeads">0</p>
            </div>
            <div class="card">
                <h3>Contacted Today</h3>
                <p id="contactedToday">0</p>
            </div>
        </section>

        <section class="leads-section">
            <div class="table-responsive">
                <table id="leadsTable">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Leads will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
