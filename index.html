<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="static/css/style.css">
    <script src="static/js/script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Universal Lead Collector</h1>
            <p>Identifying offline businesses in Bahawalpur, Punjab, Pakistan</p>
        </header>

        <section class="analytics">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="total-leads" class="stat-number">0</p>
            </div>
            <div class="stat-card new">
                <h3>New Opportunities</h3>
                <p id="new-leads" class="stat-number">0</p>
            </div>
            <div class="stat-card contacted">
                <h3>Contacted</h3>
                <p id="contacted-leads" class="stat-number">0</p>
            </div>
        </section>

        <section class="dashboard">
            <div class="table-container">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <!-- Leads will be dynamically populated here -->
                        <tr><td colspan="5" style="text-align: center;">Loading leads...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
