<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <style>
        :root {
            --primary: #25D366;
            --secondary: #128C7E;
            --background: #f0f2f5;
            --text-dark: #111b21;
            --text-light: #667781;
            --border: #e9edef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background-color: var(--secondary);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .table-container {
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: var(--text-light);
        }

        tr:hover {
            background-color: #f5f6f6;
        }

        .btn-whatsapp {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s;
        }

        .btn-whatsapp:hover {
            background-color: #1DA851;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-light);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            display: none;
        }

        .analytics {
            padding: 20px;
            background-color: #f8f9fa;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
        }

        .stat-box {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: var(--secondary);
        }

        .stat-label {
            color: var(--text-light);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Universal Lead Collector</h1>
        <p>Bahawalpur Local Businesses</p>
    </div>

    <div class="analytics">
        <div class="stat-box">
            <div class="stat-number" id="total-leads">0</div>
            <div class="stat-label">Active Leads</div>
        </div>
        <div class="stat-box">
            <div class="stat-number" id="contacted-leads">0</div>
            <div class="stat-label">Contacted (Session)</div>
        </div>
    </div>

    <div class="table-container">
        <div id="loading" class="loading">Loading leads...</div>
        <div id="empty-state" class="empty-state">No active leads available. Background scraper is running.</div>
        <table id="leads-table" style="display: none;">
            <thead>
                <tr>
                    <th>Business Name</th>
                    <th>Type</th>
                    <th>City</th>
                    <th>Phone</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="leads-body">
                <!-- Rows will be populated by JS -->
            </tbody>
        </table>
    </div>
</div>

<script src="static/js/script.js"></script>
</body>
</html>
