<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Universal Lead Collector</h1>
        <p>Bahawalpur Local Business Outreach</p>
    </header>

    <main class="container">
        <section class="analytics">
            <div class="stat-card">
                <h3>Total Leads</h3>
                <p id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <h3>Contacted</h3>
                <p id="stat-contacted">0</p>
            </div>
            <div class="stat-card">
                <h3>Pending Outreach</h3>
                <p id="stat-pending">0</p>
            </div>
        </section>

        <section class="leads-section">
            <div class="table-container">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-tbody">
                        <!-- Leads will be dynamically populated here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
