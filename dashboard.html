<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Lead Collector</title>
    <link rel="stylesheet" href="static/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <header>
            <h1>Universal Lead Collector</h1>
            <div class="analytics" id="analytics">
                <div class="stat-box">
                    <h3>Total Leads</h3>
                    <p id="total-leads">-</p>
                </div>
                <div class="stat-box">
                    <h3>Contacted</h3>
                    <p id="contacted-leads">-</p>
                </div>
            </div>
        </header>

        <main>
            <div class="table-container">
                <table id="leads-table">
                    <thead>
                        <tr>
                            <th>Business Name</th>
                            <th>Type</th>
                            <th>City</th>
                            <th>Phone</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="leads-body">
                        <!-- Leads injected here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="static/js/script.js"></script>
</body>
</html>
